name: Build Byte Vortex Launcher APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
      - name: Build APK
        run: /tmp/gradle-8.7/bin/gradle --no-daemon assembleDebug
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: byte-vortex-launcher-v1-1
          name: Byte Vortex Launcher v1.1
          make_latest: true
          files: app/build/outputs/apk/debug/app-debug.apk
